name: Auto-Sync YouTube Videos

# The site itself is built and hosted by Cloudflare Pages, which rebuilds on every
# push to main. This workflow only adds pages for new YouTube uploads; its commit
# triggers the Cloudflare rebuild (so no [skip ci] in the commit message).

on:
  schedule:
    - cron: '0 */6 * * *'  # Check for new YouTube videos every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan YouTube channels for new video uploads
        run: |
          python3 scripts/add-videos.py
          if [ -n "$(git status --porcelain src/content/videos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/videos/
            git commit -m "Auto-add new YouTube video upload(s)"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No new videos found."
          fi
