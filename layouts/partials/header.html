<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <img class="brand-logo" src="{{ "logo.svg" | relURL }}" alt="" width="34" height="34">
      <span>{{ site.Title }}</span>
    </a>
    <nav class="nav" id="nav">
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}" class="{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    <button id="menu-toggle" class="icon-btn menu-btn" aria-label="Toggle menu" aria-controls="nav">☰</button>
  </div>
</header>
