name: Deploy Hugo site & Auto-Sync YouTube Videos

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'  # Automatically check for new YouTube videos every 6 hours
  workflow_dispatch:      # Allows manual trigger anytime in GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan YouTube channels for new video uploads
        run: |
          python3 scripts/add-videos.py
          if [ -n "$(git status --porcelain content/videos)" ]; then
            echo "Found new YouTube uploads! Committing to repository..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/videos/
            git commit -m "Auto-add new YouTube video upload(s) [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No new videos found. Site is up to date."
          fi

      - name: Install Hugo (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Hugo Site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
