{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="prose">{{ .Content }}</div>
{{ with site.Taxonomies.tags }}
<div class="chips" aria-label="Filter by tag">
  {{ range .Alphabetical }}
    <a class="chip" href="{{ .Page.RelPermalink }}">#{{ .Page.Title }} <span>{{ .Count }}</span></a>
  {{ end }}
</div>
{{ end }}
<div class="grid">
  {{ range .Pages.ByDate.Reverse }}
    {{ partial "video-card.html" . }}
  {{ end }}
</div>
{{ end }}
