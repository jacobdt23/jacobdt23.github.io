<section class="subscribe">
  <h2>Enjoy the videos?</h2>
  <p>New videos are posted regularly. Subscribe so you don't miss one.</p>
  <div class="hero-actions">
    {{ range hugo.Data.channels }}
      <a class="btn" href="{{ .url }}?sub_confirmation=1" target="_blank" rel="noopener">{{ .name }}</a>
    {{ end }}
  </div>
</section>
