{{ define "main" }}
<article class="prose">
  <h1>{{ .Title }}</h1>
  <p class="meta">
    {{ with .Params.channel }}{{ . }} · {{ end }}{{ .Date.Format "January 2, 2006" }}
  </p>
  {{ with .Params.youtube_id }}
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/{{ . }}" title="{{ $.Title }}" loading="lazy" allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>
  {{ end }}
  {{ .Content }}
  {{ with .Params.tags }}
    <p class="tags">{{ range . }}<a class="tag" href="{{ printf "tags/%s/" (. | urlize) | relURL }}">#{{ . }}</a> {{ end }}</p>
  {{ end }}
</article>
{{ end }}
