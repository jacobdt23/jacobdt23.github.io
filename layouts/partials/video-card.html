<article class="card video-card" 
  data-title="{{ .Title | lower }}"
  data-channel="{{ with .Params.channel }}{{ . | lower }}{{ end }}"
  data-tags="{{ with .Params.tags }}{{ delimit . " " | lower }}{{ end }}"
  data-summary="{{ with .Params.summary }}{{ . | lower }}{{ end }}">
  <a class="card-thumb-link" href="{{ .RelPermalink }}">
    {{ with .Params.youtube_id }}
      <div class="thumb-wrapper">
        <img class="thumb" loading="lazy" src="https://i.ytimg.com/vi/{{ . }}/hqdefault.jpg" alt="Thumbnail for {{ $.Title }}">
        <span class="play-overlay">▶</span>
      </div>
    {{ else }}
      <div class="thumb thumb-empty">No thumbnail</div>
    {{ end }}
  </a>
  <div class="card-body">
    <div class="card-header-meta">
      <span class="channel-pill">{{ with .Params.channel }}{{ . }}{{ else }}Video{{ end }}</span>
      <span class="card-date">{{ .Date.Format "Jan 2, 2006" }}</span>
    </div>
    <h3 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Params.summary }}<p class="card-summary">{{ . }}</p>{{ end }}
    {{ with .Params.tags }}
      <div class="card-tags">
        {{ range first 3 . }}<span class="mini-tag">#{{ . }}</span>{{ end }}
      </div>
    {{ end }}
  </div>
</article>
