{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="prose">{{ .Content }}</div>
<div class="grid">
  {{ range hugo.Data.channels }}
    <a class="card channel" href="{{ .url }}" target="_blank" rel="noopener">
      <div class="card-body">
        <h3>{{ .name }}</h3>
        <p class="meta">{{ .handle }}{{ with .subscribers }} · {{ . }} subscribers{{ end }}</p>
        <p>{{ .description }}</p>
        <span class="btn">Visit channel</span>
      </div>
    </a>
  {{ end }}
</div>
{{ end }}
