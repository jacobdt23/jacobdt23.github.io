name: Deploy Astro site & Auto-Sync YouTube Videos

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'  # Automatically check for new YouTube videos every 6 hours
  workflow_dispatch:      # Allows manual trigger anytime in GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan YouTube channels for new video uploads
        run: |
          python3 scripts/add-videos.py
          if [ -n "$(git status --porcelain src/content/videos)" ]; then
            echo "Found new YouTube uploads! Committing to repository..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/videos/
            git commit -m "Auto-add new YouTube video upload(s) [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No new videos found. Site is up to date."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
